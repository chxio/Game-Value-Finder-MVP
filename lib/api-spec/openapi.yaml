openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: games
    description: Public game listings and value scores
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /games:
    get:
      operationId: getGameCatalog
      tags: [games]
      summary: Get value-ranked games for a platform
      parameters:
        - name: platform
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/GamePlatform"
        - name: genre
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: region
          in: query
          required: false
          description: Two-letter storefront country code
          schema:
            type: string
            minLength: 2
            maxLength: 2
      responses:
        "200":
          description: Game catalog and data-source status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameCatalog"
  /games/summary:
    get:
      operationId: getGameCatalogSummary
      tags: [games]
      summary: Get catalog counts and available genres
      parameters:
        - name: platform
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/GamePlatform"
      responses:
        "200":
          description: Summary of games available for the selected platform
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameCatalogSummary"
  /games/pc-deals:
    get:
      operationId: browsePcDeals
      tags: [games]
      summary: Browse one additional page of verified PC deals on demand
      parameters:
        - name: page
          in: query
          required: true
          description: CheapShark page number (zero-based); pages 0–2 belong to the saved 60-deal snapshot.
          schema: { type: integer, minimum: 3, maximum: 50 }
      responses:
        "200":
          description: A fetched page and its pagination status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PcDealPage"
        "400":
          description: Invalid page
        "503":
          description: Deal source or safety verification unavailable; retry later
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    GamePlatform:
      type: string
      enum: [PC, Xbox, PlayStation]
    GameSourceStatus:
      type: string
      enum: [live, snapshot, unavailable]
    GameRating:
      type: object
      description: An attributed component rating. Absence means no verified score was available, not zero.
      required: [source, audience, originalScore, originalScale, ratingOutOfFive, url]
      properties:
        source: { type: string }
        audience: { type: string, enum: [players, critics] }
        originalScore: { type: number }
        originalScale: { type: number }
        ratingOutOfFive: { type: number }
        url: { type: string }
    Game:
      type: object
      description: A discounted, paid offer with a verified matching storefront rating. Console offers currently use US storefront prices.
      required:
        - id
        - name
        - platform
        - provider
        - genre
        - imageUrl
        - storeUrl
        - reviewUrl
        - currency
        - currentPrice
        - originalPrice
        - discountPercent
        - ratingOutOfFive
        - reviewCount
        - dopeScore
      properties:
        id: { type: string }
        name: { type: string }
        platform: { $ref: "#/components/schemas/GamePlatform" }
        provider: { type: string }
        genre: { type: array, items: { type: string } }
        imageUrl: { type: string }
        storeUrl: { type: string }
        reviewUrl: { type: string }
        currency: { type: string }
        currentPrice: { type: number }
        originalPrice: { type: number }
        discountPercent: { type: number }
        ratingOutOfFive: { type: number }
        reviewCount:
          type: integer
          description: Number of player ratings reported by the rating source when captured (PC workbook uses CheapShark's Steam review count; live Steam uses positive plus negative totals).
        dopeScore: { type: number }
        ratings:
          type: array
          description: Available attributed rating components; editorial and player ratings are not averaged.
          items: { $ref: "#/components/schemas/GameRating" }
        scoreBasis:
          type: string
          description: Name of the rating source used in ratingOutOfFive and the value score.
    GameSource:
      type: object
      required: [name, url, status, detail]
      properties:
        name: { type: string }
        url: { type: string }
        status: { $ref: "#/components/schemas/GameSourceStatus" }
        detail: { type: string }
    GameCatalog:
      type: object
      description: Live console offers or a dated PC snapshot, not a comprehensive inventory. An empty catalog never implies a zero-price offer.
      required: [platform, region, currency, games, sources, refreshedAt, message]
      properties:
        platform: { $ref: "#/components/schemas/GamePlatform" }
        region: { type: string }
        currency: { type: string }
        games:
          type: array
          items: { $ref: "#/components/schemas/Game" }
        sources:
          type: array
          items: { $ref: "#/components/schemas/GameSource" }
        refreshedAt: { type: ["string", "null"], format: date-time }
        message: { type: string }
    PcDealPage:
      allOf:
        - $ref: "#/components/schemas/GameCatalog"
        - type: object
          required: [page, hasMore]
          properties:
            page: { type: integer }
            hasMore: { type: boolean }
    GameCatalogSummary:
      type: object
      required: [platform, gameCount, topDopeScore, genres, sourceStatus]
      properties:
        platform: { $ref: "#/components/schemas/GamePlatform" }
        gameCount: { type: integer }
        topDopeScore: { type: number }
        genres:
          type: array
          items: { type: string }
        sourceStatus: { $ref: "#/components/schemas/GameSourceStatus" }

